name: NegoCollab_v2xset_pretrain_m1
seed: 303
root_dir: dataset/V2XSET/train
validate_dir: dataset/V2XSET/validate
test_dir: dataset/V2XSET/test
yaml_parser: load_general_params
train_params:
  batch_size: 1
  epoches: 31
  eval_freq: 2
  save_freq: 2
  max_cav: 5
  num_workers: 0
optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1.0e-10
    weight_decay: 0.0001
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 15
  - 25
comm_range: 70
label_type: lidar
cav_lidar_range: &id003
- -102.4
- -51.2
- -3
- 102.4
- 51.2
- 1
input_source:
- lidar
add_data_extension: []
heter:
  assignment_path: opencood/hypes_yaml/v2xset/doma_protocol_negocollab/assignments/v2xset_4modality.json
  ego_modality: m1
  mapping_dict: &id002
    m1: m1
    m2: m1
    m3: m1
    m4: m1
  modality_setting:
    m1:
      sensor_type: lidar
      core_method: point_pillar
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size:
          - 0.4
          - 0.4
          - 4
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range:
        - -102.4
        - -51.2
        - -3
        - 102.4
        - 51.2
        - 1
  lidar_channels_dict: {}
fusion:
  core_method: intermediateheter
  dataset: v2xset
  args:
    proj_first: false
    grid_conf: null
    data_aug_conf: null
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range:
  - -102.4
  - -51.2
  - -3
  - 102.4
  - 51.2
  - 1
postprocess:
  core_method: VoxelPostprocessor
  gt_range:
  - -102.4
  - -51.2
  - -3
  - 102.4
  - 51.2
  - 1
  anchor_args:
    cav_lidar_range:
    - -102.4
    - -51.2
    - -3
    - 102.4
    - 51.2
    - 1
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id001
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 150
  nms_thresh: 0.15
  dir_args:
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id001
noise_setting:
  add_noise: false
model:
  core_method: homo_collab
  args:
    ego_modality: m1
    modality_setting:
      m1:
        sensor_type: lidar
        core_method: point_pillar
        preprocess:
          core_method: SpVoxelPreprocessor
          args:
            voxel_size:
            - 0.4
            - 0.4
            - 4
            max_points_per_voxel: 32
            max_voxel_train: 32000
            max_voxel_test: 70000
          cav_lidar_range:
          - -102.4
          - -51.2
          - -3
          - 102.4
          - 51.2
          - 1
    mapping_dict: *id002
    doma_protocol: true
    stage: pretrain
    lidar_range: *id003
    supervise_single: true
    pub:
      pc_grad: false
      C_uni: 64
      granularity_H: 0.8
      granularity_W: 0.8
      negotiator:
        dim: 64
        backbone_args:
          resnext: true
          inplanes: 64
          layer_nums:
          - 3
          - 4
          layer_strides:
          - 1
          - 2
          num_filters:
          - 64
          - 64
          upsample_strides:
          - 1
          - 2
          num_upsample_filter:
          - 64
          - 64
          anchor_number: 2
        shrink_header_args:
          kernal_size:
          - 3
          stride:
          - 1
          padding:
          - 1
          dim:
          - 64
          input_dim: 128
      fusion_net:
        method: single
        args:
          feat_dim: 64
      in_head: 64
      anchor_number: 2
      dir_args:
        dir_offset: 0.7853
        num_bins: 2
        anchor_yaw:
        - 0
        - 90
    m1:
      allied: true
      core_method: point_pillar
      sensor_type: lidar
      local_dim: 64
      encoder_args:
        voxel_size:
        - 0.4
        - 0.4
        - 4
        lidar_range:
        - -102.4
        - -51.2
        - -3
        - 102.4
        - 51.2
        - 1
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters:
          - 64
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
      aligner_args:
        core_method: identity
      comm_args:
        unify_parameters:
          C_uni: 64
          granularity_H: 0.8
          granularity_W: 0.8
        resizer:
          method: conv
          local_dim: 64
          reduce_raito: 2
        recombiner:
          core_method: convnext
          spatial_align: false
          args:
            num_of_blocks: 2
            dim: 64
        converter:
          num_of_blocks: 1
          dim: 64
          window_size: 8
          heads: 4
          drop_out: 0.1
        prompt_generator:
          core_method: cbam
          args:
            dim: 64
            num_of_blocks: 1
      in_head_nego: 64
      in_head_sem: 64
      fusion_net:
        method: pyramid
        args:
          resnext: true
          layer_nums:
          - 3
          - 5
          - 8
          layer_strides:
          - 1
          - 2
          - 2
          num_filters:
          - 64
          - 128
          - 256
          upsample_strides:
          - 1
          - 2
          - 4
          num_upsample_filter:
          - 128
          - 128
          - 128
          anchor_number: 2
          shrink_header:
            kernal_size:
            - 3
            stride:
            - 1
            padding:
            - 1
            dim:
            - 256
            input_dim: 384
      in_head: 256
      anchor_number: 2
      dir_args:
        dir_offset: 0.7853
        num_bins: 2
        anchor_yaw:
        - 0
        - 90
loss:
  core_method: point_pillar_pyramid_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args:
        dir_offset: 0.7853
        num_bins: 2
        anchor_yaw:
        - 0
        - 90
    depth:
      weight: 1.0
    pyramid:
      relative_downsample:
      - 1
      - 2
      - 4
      weight:
      - 0.4
      - 0.2
      - 0.1
nego_protocol:
  dataset: v2xset
  stage: pretrain/m1
  phase: pretrain
  seed: 303
  new_members: []
  parents: []
  protocol_lock: opencood/hypes_yaml/v2xset/doma_protocol_negocollab/protocol_lock.yaml
  scene_exclusions: []
  excluded_frames: []
  budget_source: opencood/hypes_yaml/opv2v/Homo/m1_pointpillar_pyramid.yaml
  checkpoint_selection: validate loss
  batch_note: batch=1 required by native mixed-ego FT; pretrain reduced from native
    batch=2 for CPU-reviewed contract
