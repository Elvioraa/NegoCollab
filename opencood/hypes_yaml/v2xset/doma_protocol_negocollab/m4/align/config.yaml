    nego_pragma:
      ratio: 5
    unify_dis:
      method: invariance
      args:
        ratio: 1
        std_ratio: 0.001
        min_atten_weight: 1
        mask_gaussian_smooth:
          k_size: 5
          c_sigma: 1.0
    unify_pragma:
      ratio: 5
    unify_stru:
      ratio: 1
      cav_lidar:
      - -102.4
      - -51.2
      - -3
      - 102.4
      - 51.2
      - 1
      feature_stride: 2
      voxel_size:
      - 0.4
      - 0.4
      - 4
    cycle_dis:
      ratio: 1
      std_ratio: 0.001
      mask_gaussian_smooth:
        k_size: 5
        c_sigma: 1.0
    collab_task:
      ratio: 1
    invariance:
      std_ratio: 0.01
      mask_gaussian_smooth:
        k_size: 5
        c_sigma: 1.0
    occ:
      pos_cls_weight: 2.0
      cls:
        type: SigmoidFocalLoss
        alpha: 0.25
        gamma: 2.0
        weight: 1.0
    det:
      pos_cls_weight: 2.0
      cls:
        type: SigmoidFocalLoss
        alpha: 0.25
        gamma: 2.0
        weight: 1.0
      reg:
        type: WeightedSmoothL1Loss
        sigma: 3.0
        codewise: true
        weight: 2.0
      dir:
        type: WeightedSoftmaxClassificationLoss
        weight: 0.2
        args:
          dir_offset: 0.7853
          num_bins: 2
          anchor_yaw:
          - 0
          - 90
      depth:
        weight: 1.0
      pyramid:
        relative_downsample:
        - 1
        - 2
        - 4
        weight:
        - 0.4
        - 0.2
        - 0.1
